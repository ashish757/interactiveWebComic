<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
        "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="512px" height="512px" viewBox="-256 -256 512 512"
     xmlns="http://www.w3.org/2000/svg" version="1.1"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Bright Sunburst</title>
    <defs>
        <g id="burst">
            <g id="quad">
                <path id="ray" d="M0,0 -69,-500 69,-500 z" />
                <use xlink:href="#ray" transform="rotate(30)"/>
                <use xlink:href="#ray" transform="rotate(60)"/>
                <use xlink:href="#ray" transform="rotate(90)"/>
            </g>
            <use xlink:href="#quad" transform="rotate(120)"/>
            <use xlink:href="#quad" transform="rotate(240)"/>
        </g>
        <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#FFA500" stop-opacity="0.2"/>
        </radialGradient>
    </defs>
    <g>
        <use xlink:href="#burst" fill="#FFD700"/>
        <use xlink:href="#burst" fill="#FF4500" transform="rotate(15)"/>
        <animateTransform attributeType="xml" attributeName="transform" type="rotate"
                          from="0 0 0" to="30 0 0" dur="2s" repeatCount="indefinite" />
    </g>
    <circle r="360px" fill="url(#grad)" />
</svg>
